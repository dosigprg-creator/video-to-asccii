[package]
name = "video_to_ascii"
version = "0.1.0"
edition = "2021"
description = "Terminal video-to-ASCII player (truecolor, >=30fps)"

[dependencies]
# TUI + terminal control
ratatui = "0.29"
crossterm = "0.28"
# Paralelisme CPU (kunci performa: proses per-baris tanpa GIL)
rayon = "1"
# Resize SIMD (AVX2/NEON)
fast_image_resize = "5"
# Channel antar-thread (bounded, drop-stale)
crossbeam-channel = "0.5"
# CLI
clap = { version = "4", features = ["derive"] }
# Error handling
anyhow = "1"
thiserror = "2"
# Hash cepat untuk row cache / style cache
ahash = "0.8"
# Stats CPU/memori
sysinfo = "0.33"
wgpu = "30.0.0"
pollster = "1.0.1"
windows = { version = "0.62.2", features = ["Win32_Graphics_Dxgi", "Win32_Foundation"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "engine_bench"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
